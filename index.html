<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portail d'Outremonde — Bientôt disponible</title>

    <meta
        name="description"
        content="Le Portail d'Outremonde est actuellement en construction. Le portail ouvrira bientôt ses portes."
    >

    <link rel="stylesheet" href="construction.css">
</head>

<body>

    <main class="page-construction">

        <!-- Décorations -->
        <div class="ornement ornement-haut-gauche"></div>
        <div class="ornement ornement-haut-droit"></div>
        <div class="ornement ornement-bas-gauche"></div>
        <div class="ornement ornement-bas-droit"></div>

        <section class="portail">

            <!-- Petit label -->
            <div class="sur-titre">
                <span></span>
                LA GUILDE D'OUTREMONDE
                <span></span>
            </div>

            <!-- Emblème -->
            <div class="embleme">
                <div class="cercle-embleme">
                    <div class="rune">✦</div>
                </div>
            </div>

            <!-- Titre -->
            <h1>
                PORTAIL
                <span>D'OUTREMONDE</span>
            </h1>

            <div class="separateur">
                <span>◆</span>
            </div>

            <!-- Message -->
            <h2>Le portail s'ouvre bientôt...</h2>

            <p class="description">
                Les cartes se dessinent, les guildes se préparent
                et de nouveaux mondes attendent d'être explorés.
            </p>


                <a href="https://elfyre.github.io/la-guilde-d-outremonde/Site.html" class="construction">
                    <span>⚒</span>
                        PORTAIL EN CONSTRUCTION
                    <span>⚒</span>
                </a>


            <!-- Petite animation de chargement -->
            <div class="runes">
                <span>◆</span>
                <span>◇</span>
                <span>◆</span>
            </div>

        </section>

        <footer>
            <span>© Portail d'Outremonde</span>
            <span class="point">•</span>
            <span>Une nouvelle aventure se prépare...</span>
        </footer>

    </main>

</body>
</html>
