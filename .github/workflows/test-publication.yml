name: Test publication automatique

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test du déclenchement automatique
        run: |
          echo "Le schedule fonctionne !"
          echo "UTC : $(date -u)"
          echo "France : $(TZ=Europe/Paris date)"
