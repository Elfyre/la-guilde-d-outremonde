name: Publication du site

on:
  schedule:
    # Tous les lundis à 00h05, heure française
    - cron: "20 13 * * 1"
      timezone: "Europe/Paris"

  # Permet une publication manuelle depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "publication"
  cancel-in-progress: false

jobs:
  publication:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer la branche develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Publier develop sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main
          git merge origin/develop --no-edit
          git push origin main

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site à GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
